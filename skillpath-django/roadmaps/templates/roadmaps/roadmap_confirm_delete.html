{% extends "base.html" %}

{% block title %}Delete roadmap{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
  <form method="post" class="neu-raised rounded-2xl p-6">
    {% csrf_token %}
    <h1 class="text-2xl font-extrabold tracking-tight">Delete “{{ object.goal }}”?</h1>
    <p class="mt-2 mb-6 text-[var(--neu-text-soft)]">This permanently deletes the roadmap and its {{ object.total }} steps, including your progress.</p>
    <div class="flex flex-wrap gap-3">
      <button type="submit" class="neu-raised rounded-xl px-5 py-3 font-semibold text-[var(--sp-error-text)]">Yes, delete it</button>
      <a href="{{ object.get_absolute_url }}" class="neu-btn-accent px-5 py-3 font-semibold">Keep it</a>
    </div>
  </form>
</div>
{% endblock %}
